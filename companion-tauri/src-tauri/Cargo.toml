[package]
name = "mechanicus-companion-tauri"
version = "0.1.0"
description = "Tauri-based desktop companion for mechanicus (experimental)"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "mechanicus-companion-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# AppKit is used to read screen geometry (work area / Dock), the physical
# mouse-button state, and to raise the host app; it must be pinned to the
# versions Tauri already resolves so nothing is duplicated.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSEvent",
  "NSRunningApplication",
  "NSScreen",
] }
objc2-foundation = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
