<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snap targets</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <!--
      Full-screen dim shown only while the overlay is being dragged. It is
      click-through, so the drag keeps working underneath it; it exists to make
      the three landing spots visible before the user lets go.
    -->

    <div id="pills" class="pills"></div>
    <script src="overlay.js"></script>
  </body>
